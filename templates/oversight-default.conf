# oversight-default.conf — the plugin-shipped, zero-requirement default
# oversight profile, consumed by bin/check-oversight.sh when no
# host-authored <base>/oversight.conf exists (T-1103; GitHub issue #343;
# .shell-team/specs/T-1103-oversight-profiles.md).
#
# This file is resolved from bin/check-oversight.sh's OWN installed
# directory, never from an adopter's working tree — the same shape
# templates/binding-default.conf already has for its own consuming checker.
# It is validated by the identical grammar a host-authored
# <base>/oversight.conf is validated by, so there is exactly one grammar
# and exactly one code path for both.
#
# `profile autonomous` declares no seam requirement: the shipped default
# changes nothing about the loop — no existing seam gains a requirement, no
# existing gate's verdict moves, and every board, spec and record that is
# conformant today stays conformant byte for byte. A host in an
# organization whose IT governance imposes segregation of duties opts in by
# authoring its own <base>/oversight.conf declaring `profile
# governance-controlled` plus one or both `seam` rows — see
# docs/adopting.md's "Choosing an oversight profile" section.

schema 1

profile autonomous
