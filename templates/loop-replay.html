  }, { passive:false });
  canvasB2.addEventListener("dblclick", function(ev){
    var hit = canvasHitTest(canvasB2, hitB2, ev);
    if(hit && hit.data && hit.data.agentId){
      camB2.focusedNode = camB2.focusedNode === hit.data.agentId ? null : hit.data.agentId;
      if(camB2.focusedNode){ camB2.interacted = true; }
      camB2.lastInteractionAt = performance.now();
      if(!camB2.focusedNode){ resetCameraB2(); }
      updateHintText();
    } else {
      resetCameraB2();
    }
  });

  function updateToolbarLabels(){
    var reset = document.getElementById("camResetBtn");
    reset.title = T().resetTitle; reset.textContent = T().resetLabel;
    var follow = document.getElementById("camFollowBtn");
    follow.title = T().followTitle; follow.textContent = camB2.followBall ? T().followingLabel : T().followLabel;
    follow.setAttribute("aria-pressed", camB2.followBall ? "true" : "false");
    var lock = document.getElementById("camLockBtn");
    lock.title = T().lockTitle; lock.textContent = camB2.autoOrbit ? T().lockLabel : T().lockedLabel;
    lock.setAttribute("aria-pressed", camB2.autoOrbit ? "false" : "true");
    var expand = document.getElementById("camExpandBtn");
    var expanded = document.getElementById("stageB2").classList.contains("expanded");
    expand.title = T().expandTitle; expand.textContent = expanded ? T().collapseLabel : T().expandLabel;
    expand.setAttribute("aria-pressed", expanded ? "true" : "false");
  }
  function updateHintText(){
    var hint = document.querySelector("#stageB2 .stage-hint");
    hint.textContent = camB2.focusedNode ? T().hintFocused(agentById[camB2.focusedNode].label) : T().hintDefault;
  }

  document.getElementById("camResetBtn").addEventListener("click", resetCameraB2);
  document.getElementById("camFollowBtn").addEventListener("click", function(){
    camB2.followBall = !camB2.followBall;
    camB2.lastInteractionAt = performance.now();
    updateToolbarLabels();
  });
  document.getElementById("camLockBtn").addEventListener("click", function(){
    camB2.autoOrbit = !camB2.autoOrbit;
    camB2.lastInteractionAt = performance.now();
    updateToolbarLabels();
  });
  document.getElementById("camExpandBtn").addEventListener("click", function(){
    var stage = document.getElementById("stageB2");
    var backdrop = document.getElementById("expandBackdrop");
    stage.classList.toggle("expanded");
    backdrop.hidden = !stage.classList.contains("expanded");
    updateToolbarLabels();
  });
  document.getElementById("expandBackdrop").addEventListener("click", function(){
    document.getElementById("camExpandBtn").click();
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && document.getElementById("stageB2").classList.contains("expanded")){
      document.getElementById("camExpandBtn").click();
    }
  });

  /* ---------------- playback state (shared transport) ---------------- */
  var state = { simMs:0, playing:false, speed:1 };
  var seekDragging = false;
  var lastTs = null;

  function updateTimeReadout(){
    var playSec = (state.simMs/TOTAL_MS) * PLAYBACK_SECONDS;
    document.getElementById("timeReadout").innerHTML = T().playbackLabel + " " + fmtClock(playSec) + " / " + fmtClock(PLAYBACK_SECONDS) +
      "　<span class='real'>" + T().realLabel + " " + fmtMs(state.simMs) + " / " + fmtMs(TOTAL_MS) + "</span>";
  }
  function updateSeekInput(){ if(seekDragging) return; document.getElementById("seek").value = Math.round((state.simMs/TOTAL_MS)*1000); }
  function updatePlayButton(){ document.getElementById("playBtn").textContent = state.playing ? "⏸" : "▶"; }

  function renderAll(){
    updateRailB(state.simMs);
    updateBNow(state.simMs);
    updateDetailPanel(state.simMs);
    updateTimeReadout();
    updateSeekInput();
    var scene = computeSceneB(state.simMs);
    var now = performance.now();
    drawB2(scene, now);
  }

  function tick(ts){
    if(state.playing){
      if(lastTs != null){
        var dt = ts - lastTs;
        var scaled = dt * state.speed * (TOTAL_MS / (PLAYBACK_SECONDS * 1000));
        state.simMs = Math.min(TOTAL_MS, state.simMs + scaled);
        if(state.simMs >= TOTAL_MS){ state.playing = false; updatePlayButton(); }
      }
    }
    lastTs = ts;
    renderAll();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.addEventListener("resize", function(){ /* canvases resize themselves each draw call */ });

  document.getElementById("playBtn").addEventListener("click", function(){
    if(state.simMs >= TOTAL_MS && !state.playing) state.simMs = 0;
    state.playing = !state.playing; updatePlayButton();
  });
  document.getElementById("speedGroup").addEventListener("click", function(ev){
    var btn = ev.target.closest("button"); if(!btn) return;
    state.speed = Number(btn.dataset.speed);
    document.querySelectorAll("#speedGroup button").forEach(function(b){ b.classList.toggle("active", b===btn); });
  });
  var seekEl = document.getElementById("seek");
  ["pointerdown","touchstart"].forEach(function(ev){ seekEl.addEventListener(ev, function(){ seekDragging = true; }); });
  ["pointerup","touchend","change"].forEach(function(ev){ seekEl.addEventListener(ev, function(){ seekDragging = false; }); });
  seekEl.addEventListener("input", function(){ state.simMs = (Number(seekEl.value)/1000) * TOTAL_MS; });
  document.getElementById("jumpRework").addEventListener("click", function(){
    var next = reworkEvents.find(function(e){ return e._tStart > state.simMs + 1; });
    if(!next) next = reworkEvents[0];
    state.simMs = next._tStart; state.playing = false; updatePlayButton();
  });

  /* ---------------- language: applying it drives every static string in one pass;
     everything else (detail panel, b-now, rail, canvas) already re-reads T()/
     trField() on its own every animation frame, so it self-corrects with no
     extra wiring. ---------------- */
  function applyLanguage(lang){
    currentLang = (lang === "ja" || lang === "en") ? lang : currentLang;
    try{ window.localStorage && localStorage.setItem(LANG_KEY, currentLang); } catch(err){ /* sandboxed — session-only */ }
    document.documentElement.lang = currentLang;
    document.querySelectorAll("#langToggle button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.lang === currentLang ? "true" : "false");
    });
    renderHeaderChips();
    renderAgentLegend();
    document.getElementById("bRailTitle").innerHTML = T().railTitleHtml;
    document.getElementById("bRail").setAttribute("aria-label", T().railAriaLabel);
    var railEmptyNoteEl = document.getElementById("railEmptyNote");
    if(railEmptyNoteEl && flagEvents.length === 0){ railEmptyNoteEl.textContent = T().flagRailEmpty; }
    document.getElementById("zoomHint").textContent = T().zoomHint;
    document.getElementById("jumpRework").textContent = T().jumpRework;
    document.getElementById("playBtn").setAttribute("aria-label", T().playAria);
    document.getElementById("seek").setAttribute("aria-label", T().seekAria);
    // defensive placeholders — renderAll() below overwrites these the instant
    // it finds a current event/step (which is always, from simMs=0 onward),
    // but keeps nothing stuck in the wrong language if that ever weren't true.
    document.getElementById("detailTitle").textContent = T().startPlayback;
    document.getElementById("bNowLabel").textContent = T().startPlayback;
    updateToolbarLabels();
    updateHintText();
    renderAll();
  }
  document.getElementById("langToggle").addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-lang]");
    if(!btn) return;
    applyLanguage(btn.dataset.lang);
  });

  // T-1012 (D2): the run id is written into the document title and the
  // masthead by THIS script from the parsed payload at runtime — never
  // injected into the HTML text directly (a second injection site in a
  // different escaping context, rejected by the spec).
  document.title = "shell-team loop replay — " + PAYLOAD.run_id;
  var titleRunIdEl = document.getElementById("titleRunId");
  if(titleRunIdEl){ titleRunIdEl.textContent = PAYLOAD.run_id; }

  applyLanguage(currentLang);
})();
</script>
