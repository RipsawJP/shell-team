# binding-template.conf — shipped specimen for the host-authored executor
# binding config format (T-1054; GitHub issue #203). Copy this file to
# <base>/binding.conf (where <base> is bin/team-paths.sh --get base) and
# edit the provider/model/effort/adapter columns to assign which executor
# runs each of the six inner-loop roles. This file itself is not read by
# this repository's own loop — see bin/check-binding.sh --help.
#
# Grammar: one required `schema <version>` line, then exactly one
# `bind <role> <provider> <model> <effort|-> <adapter>` row per role.
# `#` comments and blank lines are skipped; row order and extra whitespace
# do not matter. `effort` is positionally required — spell "no value" as
# a literal `-`, never by omitting the field.
#
# This specimen binds codex-reviewer to the codex provider and every other
# role to claude, encoding cross-provider review as the shipped default —
# a default this format does not enforce (bin/check-binding.sh validates no
# cross-provider rule; a host is free to bind every role to one provider).

schema 1

bind tech-lead     claude model-1 high claude-cli
bind pm-spec       claude model-1 -    claude-cli
bind engineer      claude model-1 -    claude-cli
bind qa-verifier   claude model-1 -    claude-cli
bind ui-designer   claude model-1 -    claude-cli
bind codex-reviewer codex model-2 -   codex-cli
