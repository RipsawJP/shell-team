# binding-default.conf — the plugin-shipped, v1-equivalent default executor
# binding, consumed by bin/resolve-executor.sh when no host-authored
# <base>/binding.conf exists (T-1057; GitHub issue #203;
# .shell-team/specs/T-1057-loop-integration.md).
#
# This file is resolved from bin/resolve-executor.sh's OWN installed
# directory (one level above it, via `cd DIR && pwd -P`), never from an
# adopter's working tree — the same shape templates/binding-adapters.txt,
# templates/task-envelope.txt and templates/durability-records.txt already
# have for their own consuming checkers. It is validated by the identical
# sibling that validates a host-authored config, bin/check-binding.sh, so
# there is exactly one grammar and exactly one code path for both.
#
# Every column here is v1-equivalent BY MEASUREMENT, not by convention: the
# five `claude-cli` rows below carry that role's own shipped frontmatter
# `model:` pin (agents/<role>.md, read from those files rather than
# transcribed by hand) — tech-lead and pm-spec on the planning tier (opus),
# engineer/qa-verifier/ui-designer on the execution tier (sonnet).
#
# `codex-reviewer` stays on `codex`/`codex-cli` so cross-provider review
# remains the shipped default. Its model column carries the ordinary token
# `provider-configured` rather than this machine's own Codex configuration:
# templates/adapters/codex-cli.txt and agents/codex-reviewer.md both record
# that the measured invocation (`codex exec --sandbox read-only --cd
# <repo> ...`) carries no model flag at all, so v1 passed nothing and the
# executor ran whatever its own installation was configured for —
# `provider-configured` names exactly that boundary rather than inventing a
# value the contract has no mechanism to apply. A bare `-` is not a legal
# substitute here: bin/check-binding.sh's MODEL_RE requires a leading
# alphanumeric, so only the `effort` column has a "no value" spelling.
#
# `effort` is `-` (unset) on every row: no role's v1 invocation applied any
# per-invocation effort level, so a v1-equivalent default introduces none —
# an adopter who wants one authors their own <base>/binding.conf.

schema 1

bind tech-lead      claude opus   - claude-cli
bind pm-spec        claude opus   - claude-cli
bind engineer       claude sonnet - claude-cli
bind qa-verifier    claude sonnet - claude-cli
bind ui-designer    claude sonnet - claude-cli
bind codex-reviewer codex provider-configured - codex-cli
