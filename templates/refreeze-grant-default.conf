# refreeze-grant-default.conf — the plugin-shipped, zero-requirement default
# class-M standing-grant declaration, consumed by bin/check-refreeze-grant.sh
# when no host-authored <base>/refreeze-grant.conf exists (T-1147; GitHub
# issue #515).
#
# This file is resolved from bin/check-refreeze-grant.sh's OWN installed
# directory, never from an adopter's working tree — the same shape
# templates/oversight-default.conf already has for its own consuming
# checker. It is validated by the identical grammar a host-authored
# <base>/refreeze-grant.conf is validated by, so there is exactly one
# grammar and exactly one code path for both.
#
# `grant none` declares no standing class-M re-freeze grant: the shipped
# default changes nothing about the loop — every class-M re-freeze still
# costs the per-instance human GO it costs today, on either host. A host
# that wants to grant one authors its own <base>/refreeze-grant.conf
# declaring `grant class-m` — see docs/tuning-oversight.md's "Who may
# re-freeze a frozen intent block" section — or, on a Claude Code host,
# keeps recording the grant in CLAUDE.local.md exactly as before; this
# file does not revoke that, and a host may use either surface, or both.

schema 1

grant none
