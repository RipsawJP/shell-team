name: fixture-usd

trigger:
  type: manual

scope:
  - tests/loop-guard

action:
  description: a single fixture iteration

budget:
  max_iterations: 0      # iteration cap untracked here — isolate the usd lever
  max_wallclock_min: 0
  max_usd: 5

stop:
  all_acs_green: true
  max_iterations_reached: true
  budget_exhausted: true
  no_progress: true

report:
  to: stderr
