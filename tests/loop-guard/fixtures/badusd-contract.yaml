name: fixture-badusd

trigger:
  type: manual

scope:
  - tests/loop-guard

action:
  description: a single fixture iteration

budget:
  max_iterations: 0
  max_wallclock_min: 0
  max_usd: five          # CORRUPT — non-numeric; guard must fail closed, not ignore

stop:
  all_acs_green: true
  max_iterations_reached: true
  budget_exhausted: true
  no_progress: true

report:
  to: stderr
