name: fixture-empty-evidence

owner: the test harness

trigger:
  type: manual

scope:
  - tests/check-contract

action:
  description: a single fixture iteration

budget:
  max_iterations: 1
  max_wallclock_min: 5
  max_subagents: 1
  max_usd: 0

stop:
  all_acs_green: true
  max_iterations_reached: true
  budget_exhausted: true
  no_progress: true

# evidence: present as a key but with NO list items -> a shape violation,
# distinct from a missing evidence key.
evidence:
# (no '- ...' items here)

report:
  to: stderr
