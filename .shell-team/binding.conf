# binding.conf — this repository's own host executor binding (T-1192, D9;
# GitHub issues #755 and #756). Identical to templates/binding-default.conf
# except for the code-reviewer model and effort, which pin the reviewer to
# gpt-6-luna at effort max (T-1195, issue #757): the model reaches every
# `codex exec` that code-reviewer and drift-evaluator run as `-m gpt-6-luna`
# and the effort as `-c model_reasoning_effort=max`, so this file is the
# single source of truth for this repository's reviewer model and effort.

schema 1

bind tech-lead      claude opus   - claude-cli
bind pm-spec        claude opus   - claude-cli
bind engineer       claude sonnet - claude-cli
bind qa-verifier    claude sonnet - claude-cli
bind ui-designer    claude sonnet - claude-cli
bind code-reviewer  codex gpt-6-luna max codex-cli
