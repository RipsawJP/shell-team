name: check-handoff

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: check-handoff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck (pinned — must match local dev version)
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck bin/check-handoff.sh tests/check-handoff/run.sh bin/check-contract.sh tests/check-contract/run.sh bin/loop-guard.sh tests/loop-guard/run.sh bin/log-run.sh tests/log-run/run.sh bin/check-run.sh tests/check-run/run.sh bin/team-init.sh tests/team-init/run.sh bin/discover-work.sh tests/discover-work/run.sh tests/discover-work/fixtures/gh bin/check-acs.sh tests/check-acs/run.sh bin/check-retro.sh tests/check-retro/run.sh bin/check-readme-version.sh tests/check-readme-version/run.sh bin/rollup-runs.sh tests/rollup-runs/run.sh bin/rollup-track.sh tests/rollup-track/run.sh bin/team-paths.sh tests/team-paths/run.sh bin/check-design-note.sh tests/check-design-note/run.sh bin/goal-state.sh tests/goal-state/run.sh bin/consolidate-proposals.sh tests/consolidate-proposals/run.sh bin/review-gate.sh tests/review-gate/run.sh bin/close-out.sh bin/gen-project-status.sh tests/close-out/run.sh bin/check-spec-review.sh tests/check-spec-review/run.sh bin/check-entry-mode.sh tests/check-entry-mode/run.sh bin/check-prompt-sync.sh tests/check-prompt-sync/run.sh bin/cluster-failures.sh tests/cluster-failures/run.sh bin/check-playbook.sh tests/check-playbook/run.sh bin/gen-playbook-blocks.sh tests/gen-playbook-blocks/run.sh bin/playbook-promote.sh tests/playbook-promote/run.sh bin/install tests/install/run.sh bin/rework-digest.sh tests/rework-digest/run.sh bin/check-intent.sh tests/check-intent/run.sh bin/check-provenance.sh tests/check-provenance/run.sh bin/check-interventions.sh tests/check-interventions/run.sh bin/check-board-headings.sh tests/check-board-headings/run.sh tests/errexit-safe/run.sh bin/codex-capture.sh tests/codex-skeleton-hygiene/run.sh bin/check-pii-shapes.sh tests/check-pii-shapes/run.sh bin/check-commit-identity.sh tests/check-commit-identity/run.sh tests/gitignore-raw-dumps/run.sh bin/retro-inputs.sh tests/retro-inputs/run.sh tests/retro-inputs/invariants.sh tests/retro-inputs/fixtures/gh tests/retro-inputs/fixtures/git docs/interventions-reminder-hook.sample.sh tests/interventions-reminder/run.sh tests/machine-tokens/run.sh bin/gen-loop-replay.sh tests/gen-loop-replay/run.sh tests/is-span-row-parity/run.sh bin/check-refreeze-class.sh tests/check-refreeze-class/run.sh tests/bin-exec-bit/run.sh bin/check-durability.sh tests/check-durability/run.sh bin/check-binding.sh tests/check-binding/run.sh bin/check-adapter.sh tests/check-adapter/run.sh bin/check-liveness.sh tests/check-liveness/run.sh bin/resolve-executor.sh tests/resolve-executor/run.sh bin/derive-populations.sh tests/derive-populations/run.sh bin/aggregate-verdicts.sh tests/aggregate-verdicts/run.sh bin/land-worktree.sh tests/land-worktree/run.sh bin/check-fanout-instances.sh tests/check-fanout-instances/run.sh docs/loop-engineering/subjects/subject-01/acceptance.sh docs/loop-engineering/subjects/subject-01/regenerate.sh tests/trial-recipe/run.sh tests/trial-recipe/extract-recipe.sh

      - name: Lint the shipped board template (hand-off linter)
        run: bash bin/check-handoff.sh templates/todo-template.md

      - name: Dogfood check-handoff — this repository's own board
        run: |
          set -e
          B="$(bash bin/team-paths.sh --get todo)"
          test -r "$B"
          bash bin/check-handoff.sh "$B"

      - name: Run check-handoff fixture suite
        run: bash tests/check-handoff/run.sh

      - name: Lint the shipped shell-team loop contract
        run: bash bin/check-contract.sh templates/shell-team.contract.yaml

      - name: Lint the shipped generic loop-contract template
        run: bash bin/check-contract.sh templates/loop-contract-template.yaml

      - name: Lint the shipped goal loop contract
        run: bash bin/check-contract.sh templates/goal.contract.yaml

      - name: Run check-contract fixture suite
        run: bash tests/check-contract/run.sh

      - name: Run loop-guard fixture suite
        run: bash tests/loop-guard/run.sh

      - name: Run check-run fixture suite
        run: bash tests/check-run/run.sh

      - name: Run log-run resolution suite
        run: bash tests/log-run/run.sh

      - name: Run team-init fixture suite
        run: bash tests/team-init/run.sh

      - name: Run trial-recipe fixture suite
        run: bash tests/trial-recipe/run.sh

      - name: Run discover-work fixture suite
        run: bash tests/discover-work/run.sh

      - name: Run check-acs fixture suite
        run: bash tests/check-acs/run.sh

      - name: Run check-design-note fixture suite
        run: bash tests/check-design-note/run.sh

      - name: Run goal-state fixture suite
        run: bash tests/goal-state/run.sh

      - name: Run rework-digest fixture suite
        run: bash tests/rework-digest/run.sh

      - name: Run check-retro fixture suite
        run: bash tests/check-retro/run.sh

      - name: Run retro-inputs fixture suite
        run: bash tests/retro-inputs/run.sh

      - name: Run retro-inputs bounded invariants lock
        run: bash tests/retro-inputs/invariants.sh

      - name: Dogfood retro-inputs — the cycle window resolves against this repository
        run: bash bin/retro-inputs.sh --base HEAD

      - name: Dogfood check-retro — this repository's own retros pass the ledger contract
        run: bash bin/check-retro.sh .shell-team/retros/*.md

      - name: Dogfood check-retro — the shipped retro template passes its own contract
        run: bash bin/check-retro.sh docs/templates/retro-template.md

      - name: Run machine-tokens fixture suite
        run: bash tests/machine-tokens/run.sh

      - name: Run gen-loop-replay fixture suite
        run: bash tests/gen-loop-replay/run.sh

      - name: Run check-readme-version fixture suite
        run: bash tests/check-readme-version/run.sh

      - name: Dogfood check-readme-version on the repo's READMEs
        run: bash bin/check-readme-version.sh README.md README.ja.md

      - name: Run rollup-runs fixture suite
        run: bash tests/rollup-runs/run.sh

      - name: Run rollup-track fixture suite
        run: bash tests/rollup-track/run.sh

      - name: Run consolidate-proposals fixture suite
        run: bash tests/consolidate-proposals/run.sh

      - name: Run cluster-failures fixture suite
        run: bash tests/cluster-failures/run.sh

      - name: Run is-span-row-parity fixture suite
        run: bash tests/is-span-row-parity/run.sh

      - name: Run review-gate fixture suite
        run: bash tests/review-gate/run.sh

      - name: Run close-out fixture suite
        run: bash tests/close-out/run.sh

      - name: Run check-spec-review fixture suite
        run: bash tests/check-spec-review/run.sh

      - name: Run check-entry-mode fixture suite
        run: bash tests/check-entry-mode/run.sh

      - name: Run check-prompt-sync fixture suite
        run: bash tests/check-prompt-sync/run.sh

      - name: Dogfood check-prompt-sync — this repo's prompt blocks must be in sync
        run: bash bin/check-prompt-sync.sh

      - name: Run check-playbook fixture suite
        run: bash tests/check-playbook/run.sh

      - name: Run gen-playbook-blocks fixture suite
        run: bash tests/gen-playbook-blocks/run.sh

      - name: Run playbook-promote fixture suite
        run: bash tests/playbook-promote/run.sh

      - name: Dogfood check-playbook — the real repository corpus at the resolved lessons path is schema-valid
        run: |
          set -e
          L="$(bash bin/team-paths.sh --get lessons)"
          test -r "$L"
          bash bin/check-playbook.sh "$L"

      - name: Dogfood gen-playbook-blocks — regenerating into a scratch copy reproduces every shipped block and consumer
        run: |
          set -e
          L="$(bash bin/team-paths.sh --get lessons)"
          test -r "$L"
          files="$(awk '$1 == "marker" && $2 ~ /^playbook-/ { for (i = 3; i <= NF; i++) print $i; print "templates/prompt-blocks/" $2 }' templates/prompt-blocks/registry.txt | sort -u)"
          scratch="$(mktemp -d "${TMPDIR:-/tmp}/gen-playbook-dogfood.XXXXXX")"
          for f in $files; do
            mkdir -p "$scratch/$(dirname "$f")"
            cp "$f" "$scratch/$f"
          done
          mkdir -p "$scratch/templates/prompt-blocks"
          cp templates/prompt-blocks/registry.txt "$scratch/templates/prompt-blocks/registry.txt"
          bash bin/gen-playbook-blocks.sh --root "$scratch" --lessons "$L"
          for f in $files; do
            cmp -s "$f" "$scratch/$f"
          done
          rm -rf "$scratch"

      - name: Run team-paths fixture suite
        run: bash tests/team-paths/run.sh

      - name: Dogfood team-paths — a repo with no legacy markers resolves to the default layout
        run: |
          test "$(bash bin/team-paths.sh --get base)"  = ".shell-team"
          test "$(bash bin/team-paths.sh --get todo)"  = ".shell-team/todo.md"
          test "$(bash bin/team-paths.sh --get specs)" = ".shell-team/specs"
          test "$(bash bin/team-paths.sh --get lessons)" = ".shell-team/lessons.md"

      - name: Run install fixture suite
        run: bash tests/install/run.sh

      - name: Run check-intent fixture suite
        run: bash tests/check-intent/run.sh

      - name: Run check-provenance fixture suite
        run: bash tests/check-provenance/run.sh

      - name: Run check-interventions fixture suite
        run: bash tests/check-interventions/run.sh

      - name: Run interventions-reminder fixture suite
        run: bash tests/interventions-reminder/run.sh

      - name: Dogfood check-interventions — every committed interventions file in this repository is conformant
        run: |
          found=0
          for f in .shell-team/interventions/*.md; do
            [ -f "$f" ] || continue
            bash bin/check-interventions.sh "$f"
            found=$((found + 1))
          done
          test "$found" -ge 1

      - name: Run check-board-headings fixture suite
        run: bash tests/check-board-headings/run.sh

      - name: Dogfood check-board-headings — this repository's own board
        run: |
          set -e
          B="$(bash bin/team-paths.sh --get todo)"
          test -r "$B"
          bash bin/check-board-headings.sh "$B" --base "origin/${GITHUB_BASE_REF:-develop}"

      - name: Run errexit-safe regression suite
        run: bash tests/errexit-safe/run.sh

      - name: Run codex-skeleton-hygiene suite
        run: bash tests/codex-skeleton-hygiene/run.sh

      - name: Run check-pii-shapes fixture suite
        run: bash tests/check-pii-shapes/run.sh

      - name: check-pii-shapes on the PR diff
        run: bash bin/check-pii-shapes.sh --base "origin/${GITHUB_BASE_REF:-develop}"

      - name: Run check-commit-identity fixture suite
        run: bash tests/check-commit-identity/run.sh

      - name: Run gitignore-raw-dumps lock suite
        run: bash tests/gitignore-raw-dumps/run.sh

      - name: check-commit-identity on the PR commits
        run: bash bin/check-commit-identity.sh --base "origin/${GITHUB_BASE_REF:-develop}"

      - name: Run check-refreeze-class fixture suite
        run: bash tests/check-refreeze-class/run.sh

      - name: Run bin-exec-bit lock suite
        run: bash tests/bin-exec-bit/run.sh

      - name: Run check-durability fixture suite
        run: bash tests/check-durability/run.sh

      - name: Dogfood check-durability — this repository's own T-1048 implement-phase records
        run: bash bin/check-durability.sh --phase implement --task T-1048 --ref HEAD

      - name: Run check-binding fixture suite
        run: bash tests/check-binding/run.sh

      - name: Dogfood check-binding — the shipped binding-config specimen validates
        run: bash bin/check-binding.sh --config templates/binding-template.conf

      - name: Run check-adapter fixture suite
        run: bash tests/check-adapter/run.sh

      - name: Dogfood check-adapter — the shipped contract and definitions validate
        run: bash bin/check-adapter.sh

      - name: Run check-liveness fixture suite
        run: bash tests/check-liveness/run.sh

      - name: Dogfood check-liveness — the real classifier's --help
        run: bash bin/check-liveness.sh --help

      - name: Run resolve-executor fixture suite
        run: bash tests/resolve-executor/run.sh

      - name: Dogfood resolve-executor — probe-free mode against this repository (the runner carries neither executor CLI)
        run: bash bin/resolve-executor.sh --print-resolved

      - name: Run derive-populations fixture suite
        run: bash tests/derive-populations/run.sh

      - name: Dogfood derive-populations — derive a real population against this repository
        run: bash bin/derive-populations.sh --label ci-dogfood --set "agents=git ls-files -- agents/*.md" --set "specs=git ls-files -- .shell-team/specs/*.md" >/dev/null

      - name: Run aggregate-verdicts fixture suite
        run: bash tests/aggregate-verdicts/run.sh

      - name: Run land-worktree fixture suite
        run: bash tests/land-worktree/run.sh

      - name: Run check-fanout-instances fixture suite
        run: bash tests/check-fanout-instances/run.sh
